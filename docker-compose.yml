version: '3.8'

services:
  # PostgreSQL Database
  db:
    image: postgres:15-alpine
    container_name: vitabrevis_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-vitabrevis}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-change_this_password}
      POSTGRES_DB: ${DB_NAME:-vitabrevis_db}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/scripts:/docker-entrypoint-initdb.d
    ports:
      - "5432:5432"
    networks:
      - vitabrevis_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-vitabrevis}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Backend API (FastAPI)
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: vitabrevis_backend
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://${DB_USER:-vitabrevis}:${DB_PASSWORD:-change_this_password}@db:5432/${DB_NAME:-vitabrevis_db}
      SECRET_KEY: ${SECRET_KEY:-your_secret_key_change_this_in_production}
      ALGORITHM: ${ALGORITHM:-HS256}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-30}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:-your_encryption_key_32_bytes_min}
      ENVIRONMENT: ${ENVIRONMENT:-development}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000,http://localhost:5173}
    volumes:
      - ./backend:/app
      - backend_uploads:/app/uploads
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - vitabrevis_network
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  # Frontend (React)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: vitabrevis_frontend
    restart: unless-stopped
    environment:
      VITE_API_URL: ${VITE_API_URL:-http://localhost:8000}
    volumes:
      - ./frontend:/app
      - /app/node_modules
    ports:
      - "3000:3000"
    depends_on:
      - backend
    networks:
      - vitabrevis_network
    command: npm run dev -- --host 0.0.0.0 --port 3000

  # Nginx Reverse Proxy (Production)
  nginx:
    image: nginx:alpine
    container_name: vitabrevis_nginx
    restart: unless-stopped
    profiles:
      - production
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
    depends_on:
      - backend
      - frontend
    networks:
      - vitabrevis_network

volumes:
  postgres_data:
    driver: local
  backend_uploads:
    driver: local

networks:
  vitabrevis_network:
    driver: bridge
